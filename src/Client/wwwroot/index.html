<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>FinancialFreedom</title>
    <base href="/" />
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="FinancialFreedom.Client.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="js/mudpopover-fix.js"></script>
    <script>
        // Must run before Blazor starts interop: some MudBlazor.dll builds call global watchDarkThemeMedia (see wwwroot/js/download.js).
        (function () {
            function bridge() {
                var mtp = window.mudThemeProvider;
                if (!mtp || typeof mtp.watchDarkMode !== 'function') return;
                if (typeof window.watchDarkThemeMedia !== 'function')
                    window.watchDarkThemeMedia = function (r) { return mtp.watchDarkMode(r); };
                if (typeof window.stopWatchingDarkThemeMedia !== 'function')
                    window.stopWatchingDarkThemeMedia = function () { return mtp.stopWatchingDarkMode(); };
            }
            bridge();
        })();
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="js/download.js"></script>
</body>

</html>
